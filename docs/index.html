<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09151e"><meta name="description" content="临界制动：一场关于节奏与控制的夜间刹车挑战。1612 N 为虚构游戏规则。">
  <title>临界制动 · 1612</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><a class="brand" href="./" aria-label="临界制动首页"><span class="brand-icon">∥</span> 临界制动 <span class="brand-number">1612</span></a><div class="top-actions"><span class="edition">夜航试炼 / 01</span><button id="sound" class="icon-button" aria-label="开启音效" aria-pressed="false">音效 OFF</button><button id="help" class="icon-button" aria-label="查看玩法">玩法 ?</button></div></header>
  <section class="game" aria-label="夜间刹车挑战">
    <div class="scene"><canvas id="world" aria-label="汽车在夜间山路行驶的游戏画面"></canvas><div class="scene-grain"></div><div class="scene-top"><span><i class="live-dot"></i> 海岸公路 · 下坡段</span><span id="phaseLabel">等待出发</span></div><div id="sceneMessage" class="scene-message" aria-live="polite"></div><div class="scene-bottom"><span class="scene-coords">NIGHT RUN <b>23:16</b></span><span id="sceneSpeed">车辆待命</span></div>
      <div id="overlay" class="overlay"><div id="panel" class="panel"></div></div>
    </div>
    <div class="dashboard">
      <div class="telemetry"><div class="speed-block"><span class="eyebrow">实时车速</span><div class="speed-value"><b id="speed">108</b><span>km/h</span></div><span id="speedHint" class="muted">控制力度，保持冷静</span></div><div class="force-block"><div class="force-head"><span class="eyebrow">踏板力度</span><span><b id="force">0</b> <small>N</small></span></div><div class="force-track"><div class="safe-range"></div><div class="warning-range"></div><div id="forceFill" class="force-fill"></div><div class="limit-marker"></div></div><div class="force-scale"><span>0</span><span class="sweet-label">舒适制动</span><span class="danger-label">断裂线 1612</span><span>2100</span></div><div class="force-bottom"><span id="forceStatus">尚未施力</span><span>峰值 <b id="peak">0</b> N</span></div></div></div>
      <div class="route"><div class="route-heading"><span class="eyebrow">前方路况</span><span id="targetText">第一弯道 · 限速 80 km/h</span><span id="remaining">180 m</span></div><div class="route-line"><div id="routeFill"></div><i id="routeCar"></i><span class="route-gate" style="left:32.14%"><b>80</b></span><span class="route-gate" style="left:62.5%"><b>55</b></span><span class="route-bay">停车区</span></div><div class="route-labels"><span>起点</span><span>560 m</span></div></div>
      <div class="controls"><div class="control-copy"><span id="controlTitle">一点节奏，一线生机。</span><small>按住加压 · 松开卸力 · 点按稳住力度</small><div class="keyboard-hint"><kbd>空格</kbd> 刹车 <kbd>Esc</kbd> 暂停 <kbd>R</kbd> 重开</div></div><button id="pedal" class="pedal" aria-label="刹车踏板，按住加压，松开卸力"><span class="pedal-glyph">▰</span><span>按住刹车<small>HOLD TO BRAKE</small></span><span class="pedal-arrow">↓</span></button><button id="pause" class="pause-button" aria-label="暂停游戏" disabled>Ⅱ</button></div>
    </div>
  </section>
  <footer><span>一个关于克制的街机实验。</span><span>1612 N 仅为虚构游戏规则，不代表实际车辆安全阈值。</span></footer>
</main>
<script type="module" src="game.js"></script>
</body></html>
